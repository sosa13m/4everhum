name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.15-${{ runner.os }}

      - name: Configurar
        run: cmake -B build -A x64

      - name: Compilar
        run: cmake --build build --config Release --target FourEverHum_VST3 FourEverHum_Standalone hum2midi dsp_tests midi_export_test

      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Subir VST3
        uses: actions/upload-artifact@v4
        with:
          name: 4EVERHUM-windows
          path: |
            build/FourEverHum_artefacts/Release/VST3/
            build/FourEverHum_artefacts/Release/Standalone/
            build/hum2midi_artefacts/Release/hum2midi.exe
